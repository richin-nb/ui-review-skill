<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Northside Clinic</title>
<style>body{font:15px system-ui;margin:0;color:#222}header{background:#0b5;color:#fff;padding:12px 16px;font-weight:600}main{padding:20px;max-width:720px}
input,select{display:block;margin:8px 0 14px;padding:8px;width:100%;box-sizing:border-box;border:1px solid #ddd}.hint{color:#bbb;font-size:12px}
.icon{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border:1px solid #ccc;border-radius:4px;font-size:11px;cursor:pointer}
.err{background:#fee;color:#900;padding:8px;margin:8px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}</style></head><body><header>Northside Clinic</header><main><h1>Book an appointment</h1>
<form onsubmit="event.preventDefault();document.getElementById('e').hidden=false">
<input placeholder="Full name"><input placeholder="Phone"><input placeholder="Date (DD/MM)"><select><option>Choose a doctor</option><option>Dr Patel</option><option>Dr Novak</option></select>
<p class="hint">We will text you a reminder the day before. Cancellations less than 24 hours before are charged.</p>
<div class="err" id="e" hidden>Error 422: validation failed</div>
<button>Submit</button></form></main></body></html>
